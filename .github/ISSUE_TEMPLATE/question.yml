name: Question
description: Ask about the material or the code.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Please give enough context that we can help.
  - type: input
    id: context
    attributes:
      label: Chapter / section / file (if applicable)
      placeholder: "e.g., Chapter 8, or notebooks/ch08/ch8_preprocessing.py"
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
